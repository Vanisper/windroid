[package]
name = "runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "运行环境域：实例目录、模拟器进程、adb 就绪判定。"

[dependencies]
contract = { path = "../contract" }
adb = { path = "../adb" }

log = "0.4"
serde.workspace = true
serde_json.workspace = true
libc = "0.2"
base16ct = { version = "1", features = ["alloc"] }
sha1 = "0.11"
sha2 = "0.11"
zip = { version = "9.6.1", default-features = false, features = ["deflate"] }
windroid-diagnostics = { path = "../diagnostics" }
windroid-locations = { path = "../locations" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFString"] }
