[package]
name = "host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Windroid 呈现域：窗口所有权、视频表面、关闭拦截，以及设备域到界面的桥。"

[dependencies]
contract = { path = "../contract" }
device = { path = "../device" }
stream = { path = "../stream" }
nsh-core = "0.5"
nsh-engine = { version = "0.5", features = ["js-core"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = "0.5"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-metal = "0.3"
objc2-quartz-core = { version = "0.3", features = ["CAMetalLayer", "CALayer"] }
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"

[dev-dependencies]
env_logger = "0.11"
dispatch2 = "0.3"
nsh-testing = { version = "0.5", features = ["bundle"] }
