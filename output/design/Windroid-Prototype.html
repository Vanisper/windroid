#stage.dark {
  color-scheme: dark;
  --ink: #f0f0f5;
  --muted: #b5b8c7;
  --soft: #a0a6b8;
  --accent: #bbc6ff;
  --tint: #333b58;
  --border: #3d414e;
  --paper: #202228;
  --rail: #252730;
  --raised: #2b2e38;
  --control: #353944;
  --control-border: #535867;
  --hover: #3a3e4a;
  --danger: #ffb6aa;
  color: var(--ink);
  background: var(--paper);
  border-color: #4b4f5c;
  box-shadow: 0 14px 42px #15172538, 0 2px 7px #10121d26;
}

#stage.dark .titlebar { background: #282a32; }
#stage.dark .bar-rule,
#stage.dark .rule { background: var(--border); }
#stage.dark .rail { background: var(--rail); }
#stage.dark .main { background: var(--paper); }
#stage.dark .brand img { border-radius: 6px; outline: 1px solid #969ddd54; outline-offset: -1px; }
#stage.dark .brand strong,
#stage.dark .navname,
#stage.dark .task-app,
#stage.dark .tile-name { color: var(--ink); }
#stage.dark .window-toggle,
#stage.dark .rail-head,
#stage.dark .rail-foot button,
#stage.dark .navstate { color: var(--muted); }
#stage.dark .rail-foot { border-color: var(--border); }
#stage.dark .initial {
  color: #d4d8e6;
  background: #373b47;
  border-color: #555b6c;
}
#stage.dark .navitem:hover,
#stage.dark .rail-foot button:hover,
#stage.dark .window-toggle:hover { background: var(--hover); }
#stage.dark .navitem.cur,
#stage.dark .rail-foot button.sel { background: #373e58; }
#stage.dark .navitem.cur .initial {
  color: #e7eaff;
  background: #495477;
  border-color: #737ea7;
}
#stage.dark .dot { background: #b4b8c4; }
#stage.dark .dot.ready { background: #82c9a1; }
#stage.dark .dot.starting { background: #edbf70; }
#stage.dark .dot.frozen { background: #a2bffb; }
#stage.dark .app-section + .app-section,
#stage.dark .task-line { border-color: var(--border); }
#stage.dark .launch:hover,
#stage.dark .tile:focus-within { background: var(--raised); }
#stage.dark .badge { box-shadow: inset 0 0 0 1px #ffffff20; }
#stage.dark .task-shelf { background: #25272f; border-color: var(--border); }
#stage.dark .count { color: #d2d6e4; background: #363a48; }
#stage.dark .empty-drop,
#stage.dark .apk-source { color: var(--muted); background: var(--raised); border-color: #5b6172; }
#stage.dark .empty-drop strong { color: var(--ink); }
#stage.dark .btn { color: var(--ink); background: var(--control); border-color: var(--control-border); }
#stage.dark .btn.primary {
  color: #181f3a;
  background: var(--accent);
  border-color: var(--accent);
}
#stage.dark .btn.soft {
  color: #d7deff;
  background: #35415e;
  border-color: #48587c;
}
#stage.dark .btn.danger,
#stage.dark .wx-danger { color: var(--danger); }
#stage.dark .btn.quiet,
#stage.dark .ib {
  background: transparent;
  color: #c4c9da;
  border-color: transparent;
}
#stage.dark .btn.quiet:hover,
#stage.dark .ib:hover { background: var(--hover); }
#stage.dark button:focus-visible,
#stage.dark input:focus-visible,
#stage.dark select:focus-visible,
#stage.dark summary:focus-visible { outline-color: #adbdff; }
#stage.dark .field input,
#stage.dark .field select,
#stage.dark .form input,
#stage.dark .form select,
#stage.dark .rt-control { color: var(--ink); background: var(--control); border-color: var(--control-border); }
#stage.dark .rt-control::placeholder { color: var(--soft); }
#stage.dark .empty-symbol,
#stage.dark .rt-status-icon { color: var(--accent); background: var(--tint); }
#stage.dark .notice,
#stage.dark .surface,
#stage.dark .rt-summary,
#stage.dark .rt-terms { background: var(--raised); border-color: var(--border); }
#stage.dark .rt-table,
#stage.dark .rt-component,
#stage.dark .rt-fact { border-color: var(--border); }
#stage.dark .rt-subtle,
#stage.dark .rt-component small,
#stage.dark .rt-aside,
#stage.dark .rt-fact > span:first-child { color: var(--muted); }
#stage.dark .rt-license,
#stage.dark .rt-source { color: var(--accent); }
#stage.dark .progress,
#stage.dark .rt-graph,
#stage.dark .apk-meter { background: #454b5b; }

#stage.dark .dialog-card,
#stage.dark .wx-ask,
#stage.dark .wx-menu,

  color: var(--ink);
  background: var(--raised);
  border-color: #555b6a;
  box-shadow: 0 12px 38px #08091265;
}
#stage.dark .dialog-foot { background: #292b34; border-color: var(--border); }
#stage.dark .wx-window { border-color: #575b69; }
#stage.dark .wx-title { color: #e3e6f1; background: #30333b; border-color: #454853; }
#stage.dark .wx-ask p,
#stage.dark .wx-ask label,
#stage.dark .wx-menutitle,
#stage.dark .apk-target,
#stage.dark .apk-hint,
#stage.dark .apk-copy,
#stage.dark .apk-detail,
#stage.dark .apk-file small { color: var(--muted); }
#stage.dark .wx-ask input { accent-color: var(--accent); }
#stage.dark .wx-menuitem:hover,
#stage.dark .wx-menuitem:focus-visible,
#stage.dark .apk-choice:hover { background: var(--hover); }
#stage.dark .wx-menu hr,
#stage.dark .apk-choice + .apk-choice { border-color: var(--border); }
#stage.dark .apk-file,
#stage.dark .apk-detail pre { color: var(--ink); background: #363a47; }
#stage.dark .apk-target strong { color: var(--ink); }
#stage.dark .apk-symbol { color: #c8d8fd; background: #394762; }
#stage.dark .apk-symbol.ok { color: #a0dfb6; background: #2d4b3b; }
#stage.dark .apk-err,
#stage.dark .rt-error { color: var(--danger); }
#stage.dark .apk-symbol.fail,
#stage.dark .rt-status-icon.error { color: #ffbcad; background: #583b35; }
#stage.dark.dragover:after { color: #dce3ff; background: #292e42ed; border-color: #acbbfb; }

@media (max-width: 550px) {
  .viewer.compact .titlebar { padding-inline: 9px; gap: 7px; }

  .viewer.compact .catalog { padding-inline: 15px; }

function apkChooseTarget(device) {
  if (!device || device.state !== 'ready') {
    notify('请先启动目标实例。');
    return false;
  }
  S.overlay = {kind:'apk-choose', targetId:device.id, targetName:device.name};
  return true;
}

function apkSelect(files) {
  const o = S.overlay;
  if (!o || o.kind !== 'apk-choose') return;
  const items = typeof files === 'string' ? [files] : Array.from(files || []);
  if (!items.length) return;
  const name = typeof items[0] === 'string' ? items[0] : items[0].name;
  if (items.length !== 1 || !name || !/\.apk$/i.test(name)) {
    o.error = items.length > 1 ? '每次请选择一个 APK 文件。' : '请选择扩展名为 .apk 的文件。';
    return;
  }
  const key = name === apkSamples.conflict.name ? 'conflict' : 'fieldnotes';
  S.overlay = {...o, kind:'install-confirm', filename:name, sample:key, error:''};
}

// A file chooser or a drag starts on a specific instance. Later selection changes do not retarget the install.
function dropApk(files) {
  if (S.overlay && S.overlay.kind !== 'apk-choose') return;
  if (!S.overlay && !apkChooseTarget(cur())) { render(); return; }
  apkSelect(files);
  render();
}
function apkLocalFile() {
  const owner = S.overlay;
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.apk';
  input.hidden = true;
  document.body.append(input);
  input.addEventListener('change', () => {
    if (S.overlay === owner) {
      apkSelect(input.files);
      render();
    }
    input.remove();
  }, {once:true});
  input.addEventListener('cancel', () => input.remove(), {once:true});
  input.click();
}

function apkTarget(o) {
  return '<p class="apk-target">'+ico('monitor',16)+'<span>目标实例　<strong>'+esc(o.targetName)+'</strong></span></p>';
}
function apkFile(o, type) {
  const badge = type === 'fail' ? 'triangle-alert' : 'package';
  return '<div class="apk-file"><span class="apk-symbol '+type+'">'+ico(badge,19)+'</span><strong>'+esc(o.filename)+'</strong></div>';
}
function apkExample(key) {
  return '<button type="button" class="apk-choice" data-action="apk-example" data-value="'+key+'">'+ico('file',16)+'<span>'+esc(apkSamples[key].name)+'</span></button>';
}
overlays['apk-choose'] = () => {
  const o = S.overlay;
  const message = o.error ? '<p role="alert" class="apk-copy apk-err">'+esc(o.error)+'</p>' : '';
  return sheet('选择安装包', apkTarget(o)+'<div class="apk-source"><span>将 APK 拖到这里</span>'+b('选择本地文件…','apk-local','','plain')+'</div><p class="apk-hint">演示文件</p>'+apkExample('fieldnotes')+apkExample('conflict')+message+'<p class="apk-hint">本地 APK 使用演示应用模拟安装。</p>',b('取消','apk-dismiss','','plain'));
};
overlays['install-confirm'] = () => {
  const o=S.overlay;
  return sheet('安装应用？',apkTarget(o)+apkFile(o,''),b('取消','apk-dismiss','','plain')+b('安装','apk-start','','primary'));
};
overlays['apk-installing'] = () => sheet('正在安装',apkTarget(S.overlay)+apkFile(S.overlay,'')+'<div class="apk-meter" aria-label="正在安装" role="progressbar"></div>','');
overlays['install-error'] = () => {
  const o=S.overlay;
  const detail = o.raw ? '<details class="apk-detail"><summary>原始错误</summary><pre>'+esc(o.raw)+'</pre></details>' : '';
  return sheet('安装失败',apkTarget(o)+apkFile(o,'fail')+'<p class="apk-copy apk-err">'+esc(o.reason)+'</p>'+detail,b('关闭','apk-dismiss','','plain')+b('重新选择…','apk-reselect','','primary'));
};
function apkSignatureError(o) {
  return {...o,kind:'install-error',reason:'应用签名不一致，已保留原版本。',raw:'INSTALL_FAILED_UPDATE_INCOMPATIBLE: Package '+apkSamples.conflict.packageName+' signatures do not match previously installed version; ignoring!'};
}
function apkRecordSuccess(device) {
  if (!device.installed.includes('fieldnotes')) {
  device.installed.push('fieldnotes');
  if(windowDefaults().autoLauncher)(device.macLaunchers||={})[appPackage('fieldnotes')]='fieldnotes';
 }
  device.panelTab='apps';
  S.justInstalled = {id:device.id, key:'fieldnotes'};
}
function apkCommit() {
  const job = S.overlay;
  if (job?.kind !== 'install-confirm') return;
  const session = S;
  const device = inst(job.targetId);
  const progress = {...job,kind:'apk-installing'};
  S.overlay = progress;
  setTimeout(() => {
    if (S !== session) return;
    let error;
    if (!device || inst(job.targetId) !== device || device.state !== 'ready') {
      error = {...job,kind:'install-error',reason:'实例不可用，请启动后重试。',raw:''};
    } else if (job.sample === 'conflict') {
      error = apkSignatureError(job);
    }
    if (error) {
      if (S.overlay === progress) S.overlay = error;
      else notify('安装失败 · '+job.targetName);
    } else {
      apkRecordSuccess(device);
      if (S.overlay === progress) {
        S.overlay = null;
        if (S.selected === device.id) {
          go('panel');
          if(document.body.classList.contains('using-keys'))S.focusNewApp='fieldnotes';
        }
      }
      if (S.selected !== device.id || S.page !== 'panel') notify('已安装到「'+job.targetName+'」');
    }
    render();
  }, 550);
}
on('add-apk', () => apkChooseTarget(cur()));
on('apk-example', key => { if (apkSamples[key]) apkSelect(apkSamples[key].name); });
on('apk-local', apkLocalFile);
on('apk-start', apkCommit);
on('apk-reselect', () => {
  const o=S.overlay;
  if(o) S.overlay={kind:'apk-choose',targetId:o.targetId,targetName:o.targetName};
});
on('apk-dismiss', () => {S.overlay=null;});

function apkPose(key, stage) {
  const target=cur();
  const o={targetId:target.id,targetName:target.name,sample:key,filename:apkSamples[key].name,kind:stage};
  S.overlay = stage === 'install-error' ? apkSignatureError(o) : o;
}
poses['install-confirm'] = () => apkPose('fieldnotes','install-confirm');
poses['install-error'] = () => apkPose('conflict','install-error');
poses['install-success'] = () => {
  const device=inst('daily') || cur();
  go('panel');
  S.review='install-success';
  S.selected=device.id;
  apkRecordSuccess(device);
};

const wxDevice = '@device';
const closePreferenceKey='windroid.prototype.applicationWindowClose';
const validClosePreferences=new Set(['ask','background','quit']);
let windowClosePreference='ask';
try{
 const stored=window.localStorage.getItem(closePreferenceKey);
 if(validClosePreferences.has(stored))windowClosePreference=stored;
}catch{}

function readClosePreference(){return windowClosePreference;}
function setClosePreference(value){
 if(!validClosePreferences.has(value))return;
 windowClosePreference=value;
 // A local preview with storage disabled still shares this choice across instances.
 try{window.localStorage.setItem(closePreferenceKey,value);}catch{}
}

 if(!f.name.trim()||Array.from(f.name.trim()).length>64||/[\u0000-\u001f\u007f-\u009f]/.test(f.name))return '请填写 1 至 64 个字符的实例名称。';
 if(maxUserGiB()<6)return '可分配空间不足 6 GiB，请先释放磁盘空间。';
 const disk=Number(f.disk);if(!Number.isInteger(disk)||disk<6||disk>maxUserGiB())return '用户空间可设为 6 至 '+maxUserGiB()+' GiB 的整数。';
 return hardwareCreateError(f);
}
function allocateDevice(f,show){
 const error=draftError(f);if(error){S.createDraft={...f,error};if(show)go('create');return;}
 const id='device-'+Date.now().toString(36)+'-'+(++runtimeSequence),d=newInstance(id,f.name.trim(),f.template,'stopped');
 d.imageId=f.imageId;d.diskGiB=Number(f.disk);assignInstanceHardware(d,f);d.graphics=f.graphics||'host';d.neverStarted=true;S.instances.push(d);delete S.createDraft;
 if(show){if(S.setupStep==='create'){delete S.setupStep;delete S.setupOrigin;}S.workspaceOpen=true;S.selected=id;go('panel');notify('已创建「'+d.name+'」');}
}
function startCreate(){
 if(S.page!=='create')return;const f=createDraft();f.error=draftError(f);if(f.error)return;
 if(S.env!=='ready'){go('environment');return;}
 if(localImageIds().includes(f.imageId)){allocateDevice(f,true);return;}
 if(S.imageJob){go('image-transfer');return;}
 S.overlay={kind:'image-terms',id:f.imageId,create:true};
}
on('rt-create-submit',startCreate);
function createField(label,id,input,note=''){
 return '<div class="ci-field"><label for="'+id+'">'+label+'</label><div class="ci-value">'+input+(note?'<small>'+note+'</small>':'')+'</div></div>';
}
function capacityHint(custom){
 const max=maxUserGiB();
 if(max<6)return '可分配空间不足 6 GiB，请先释放磁盘空间。';
 return custom?'6–'+max+' GiB，限整数。':max<capacityPresets.at(-1)?'本机最多可分配 '+max+' GiB。':'';
}
function capacityField(f){
 const max=maxUserGiB(),custom=!!f.customMode;
 const choices=[...capacityPresets,'custom'].map(value=>{
  const other=value==='custom',disabled=other?max<6:value>max;
  const selected=other?custom:!custom&&String(value)===f.disk;
  const label=other?'自定义':value+' GiB';
  return '<label class="ci-cap-choice"><input type="radio" name="ci-size-choice" value="'+value+'"'+(disabled?' disabled':'')+(selected&&!disabled?' checked':'')+'><span>'+label+'</span></label>';
 }).join('');
 const number='<div class="ci-number" id="ci-custom-space"'+(custom?'':' hidden')+'><label for="ci-disk">自定义容量</label><input id="ci-disk" type="number" min="6" max="'+max+'" step="1" class="rt-control" value="'+esc(custom?f.disk:f.customDisk??f.disk)+'" aria-describedby="ci-disk-hint"><span>GiB</span></div>';
 return '<div class="ci-field"><span class="ci-cap-label" id="ci-cap-label">用户空间</span><div class="ci-value"><div class="ci-cap-options" role="radiogroup" aria-labelledby="ci-cap-label" aria-describedby="ci-disk-hint">'+choices+'</div>'+number+'<small id="ci-disk-hint">'+esc(capacityHint(custom))+'</small></div></div>';
}
function chooseCapacity(el){
 const f=createDraft(),custom=el.value==='custom';
 f.customMode=custom;
 f.disk=custom?(f.customDisk??f.disk):el.value;
 f.error='';
 const number=document.getElementById('ci-custom-space');
 number.hidden=!custom;
 number.querySelector('input').value=f.disk;
 document.getElementById('ci-disk-hint').textContent=capacityHint(custom);
 document.querySelector('#ci-form .rt-error')?.remove();
 if(custom){const field=number.querySelector('input');field.focus();field.select();}

function imageTick(job){
 if(S.imageJob!==job||job.failed||job.paused)return;
 job.progress=Math.min(100,job.progress+11);
 if(job.progress===100){
  if(!localImageIds().includes(job.id))S.rtImages.push(job.id);
  const show=S.page==='image-transfer';delete S.imageJob;
  if(job.create)allocateDevice(job.draft,show);
  else if(show&&job.guided&&S.setupStep==='images')useSetupImage(job.id);
  else if(show){S.imageOrigin=S.setupStep==='images'?'setup':'environment';go('image-list');}
  saveFirstUseWorkspace();
  if(!S.overlay)render();return;
 }
 if(S.page==='image-transfer'&&!S.overlay){const meter=document.querySelector('#ci-progress');if(meter){meter.setAttribute('aria-valuenow',job.progress);meter.firstElementChild.style.width=job.progress+'%';}const pct=document.querySelector('#ci-pct');if(pct)pct.textContent=job.progress+'%';}
 setTimeout(()=>imageTick(job),400);
}
on('image-start',()=>{

 if(S.imageJob){go('image-transfer');return;}
 const job={id:o.id,create:o.create,guided:S.setupStep==='images',draft:o.create?{...createDraft()}:null,progress:0};S.imageJob=job;go('image-transfer');setTimeout(()=>imageTick(job),400);
});
on('image-cancel',()=>{const job=S.imageJob;if(!job)return;delete S.imageJob;go(job.create?'create':'image-list');});
on('image-retry',()=>{const job=S.imageJob;if(!job||(!job.failed&&!job.paused))return;job.failed=false;job.paused=false;setTimeout(()=>imageTick(job),400);});

};

function panelBootRefresh(d){
 const stage=document.getElementById('stage');
 refreshHardwareAvailability();
 const row=Array.from(stage.querySelectorAll('.navitem')).find(el=>el.dataset.value===d.id);
 if(row){
  const label=d.name+' · '+panelStateText(d);
  row.title=label;row.setAttribute('aria-label',label);
  row.querySelector('.state-mark').innerHTML=panelStateSymbol(d);
 }
 if(S.page==='emulator-log'&&S.logInstanceId===d.id&&d.state==='ready'&&!S.overlay){render();return;}
 if(S.selected!==d.id||!['panel','manage'].includes(S.page))return;
 if(d.state==='starting'||d.state==='stalled'){
  const detail=stage.querySelector('[data-boot-detail],.rt-content .rt-lead');
  if(detail)detail.textContent=panelBootLabel(d);
 }else if(!S.overlay)render();
}

function panelFocusMenu(key){
 if(!document.body.classList.contains('using-keys'))return;
 setTimeout(()=>{
  if(S.overlay?.kind==='wx-menu')document.querySelector('.wx-menuitem')?.focus({preventScroll:true});
  else if(!S.front){
   const target=Array.from(document.querySelectorAll('.running-more')).find(el=>el.dataset.value===key);
   (target||document.getElementById('panel-tab-tasks'))?.focus({preventScroll:true});
  }
 },0);
}
document.addEventListener('click',event=>{
 const button=event.target.closest('button');
 if(!button)return;
 if(button.dataset.action==='task-menu')panelFocusMenu(button.dataset.value);
 else if(S.overlay?.kind==='wx-menu'&&S.overlay.mode==='task')panelFocusMenu(S.overlay.key);
},true);
document.addEventListener('keydown',e=>{
 const tab=e.target.closest('[role="tab"][data-action="panel-tab"]');
 if(tab&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){
  e.preventDefault();document.body.classList.add('using-keys');
  const next=e.key==='Home'?'apps':e.key==='End'?'tasks':tab.dataset.value==='apps'?'tasks':'apps';
  actions.get('panel-tab')(next);render();document.getElementById('panel-tab-'+next)?.focus();return;
 }
 if(S.overlay?.kind!=='wx-menu'||S.overlay.mode!=='task')return;
 if(e.key==='Escape'){
  e.preventDefault();e.stopImmediatePropagation();const key=S.overlay.key;S.overlay=null;render();panelFocusMenu(key);return;
 }
 if(!['ArrowUp','ArrowDown','Home','End','Tab'].includes(e.key))return;
 const items=Array.from(document.querySelectorAll('.wx-menuitem'));
 if(!items.length)return;
 e.preventDefault();e.stopImmediatePropagation();document.body.classList.add('using-keys');
 const index=items.indexOf(document.activeElement),back=e.key==='ArrowUp'||e.key==='Tab'&&e.shiftKey;
 const n=e.key==='Home'?0:e.key==='End'?items.length-1:(index<0?back?items.length-1:0:(index+(back?-1:1)+items.length)%items.length);
 items[n].focus();
},true);

const batchVerb = {start:'启动', stop:'停止'};

function batchForInstances(){ return S.instanceBatch || null; }

function instanceBatchEligible(action, d){
 return action==='stop' ? Boolean(runtimeCanStop(d)) : action==='start' && Boolean(runtimeCanStart(d));
}

function batchSkipReason(action,d){
 if(!d)return '实例已移除';
 if(action==='start' && (d.state==='ready'||d.state==='streaming'))return '已在运行';
 return stateNames[d.state] || d.state;
}

function requestInstanceBatch(action,ids,scope){
 if(!batchVerb[action] || S.page!=='instances' || batchForInstances()?.phase==='running')return false;
 if(action==='start')refreshAdmissionSample();
 const selected=selectedInstanceIds();
 const targetIds=[...new Set(ids ?? (selected.length?selected:S.instances.map(d=>d.id)))];
 if(!targetIds.length)return false;
 const kind=scope || (selected.length || targetIds.length!==S.instances.length?'selected':'all');
 const priorItems=batchForInstances()?.items || [];
 const items=targetIds.map(id=>{
  const d=inst(id), eligible=instanceBatchEligible(action,d);
  const name=d?.name || priorItems.find(item=>item.id===id)?.name || id;
  return {id,name,eligible,state:d?.state,reason:eligible?'':batchSkipReason(action,d)};
 });
 S.overlay={kind:'instance-batch-confirm',action,scope:kind,items};return true;
}

on('batch-cancel',()=>{if(S.overlay?.kind==='instance-batch-confirm')S.overlay=null;});
on('batch-recheck',()=>{if(S.overlay?.kind==='instance-batch-confirm'&&S.overlay.action==='start')refreshAdmissionSample();});
on('batch-dismiss',()=>{if(batchForInstances()?.phase==='done'){delete S.instanceBatch;S.instanceSelection=[];}});
on('batch-retry',()=>{
 const job=batchForInstances();if(job?.phase!=='done')return;
 const failed=job.items.filter(item=>item.status==='failed').map(item=>item.id);
 requestInstanceBatch(job.action,failed,'retry');
});

overlays['instance-batch-confirm']=()=>{
 const {action,scope,items}=S.overlay,verb=batchVerb[action];
 const eligible=items.filter(i=>i.eligible),live=eligible.map(i=>inst(i.id)).filter(Boolean);
 const usage=hardwareUsage(),predictions=new Map();
 if(action==='start')for(const d of live){
  const reason=runtimeStartBlock(d,usage);predictions.set(d.id,reason);
  if(!reason){
   const memory=hardwareEffectiveMiB(d);
   usage.plannedMiB=(usage.plannedMiB||0)+memory;
   usage.count++;usage.memory+=memory;usage.cores+=hardwareValues(d,true).cpuCores;
  }
 }
 const blocked=[...predictions.values()].filter(Boolean);
 const blockedAll=live.length>0 && blocked.length===live.length;
 const canCommit=eligible.length>0&&!blockedAll;
 const partial=action==='start'&&blocked.length>0&&!blockedAll;
 const title=blockedAll?'暂时无法启动':partial?'依次尝试启动 '+eligible.length+' 个实例？':eligible.length?verb+' '+eligible.length+' 个实例？':'没有可'+verb+'的实例';
 const scopeText=scope==='retry'?'重试失败的':scope==='all'?'本机全部':'已选';
 const impact=blockedAll?blocked[0]:action==='stop'?'应用窗口和设备视图将关闭，后台任务将结束。':blocked.length?'按所列顺序，当前可启动 '+(live.length-blocked.length)+' 个。每次启动前会再次检查。':'实例将依次启动。';
 const rows=items.map(i=>{
  let effect=i.reason+'，跳过';
  if(i.eligible)effect=predictions.get(i.id)||((action==='stop'&&['starting','stalled'].includes(i.state))?'中止启动':'将'+verb);
  return '<li><span>'+esc(i.name)+'</span><small'+(i.eligible?'':' class="batch-muted"')+'>'+esc(effect)+'</small></li>';
 }).join('');
 const advice=action==='start'&&!blockedAll?hardwareStartAdvisory():'';
 const body='<p class="batch-scope">'+scopeText+' '+items.length+' 个实例</p><ul class="batch-targets" aria-label="'+verb+'范围" tabindex="0">'+rows+'</ul>'+(eligible.length?'<p class="batch-impact">'+esc(impact)+'</p>':'')+(advice?'<p class="batch-impact">'+esc(advice)+'</p>':'');
 const buttons=b(canCommit?'取消':'完成','batch-cancel','','plain')+(canCommit?b(partial?'依次尝试启动':verb+' '+eligible.length+' 个','batch-commit','','primary'):blockedAll?b('重新检查','batch-recheck','','plain'):'');
 return sheet(title,body,buttons).replace('class="dialog-card"','class="dialog-card batch-dialog"');
};

function makeInstanceBatch(spec){
 const job={action:spec.action,phase:'running',items:spec.items.map(i=>({
  id:i.id,name:i.name,status:i.eligible?'pending':'skipped',message:i.eligible?'等待处理':i.reason
 }))};
 S.instanceBatch=job;return job;
}

function updateInstanceBatchView(job){
 if(batchForInstances()!==job || S.page!=='instances' || S.front || S.overlay)return;
 refreshInstanceList();
}

function recordBatchResult(item,status,message){
 item.status=status;item.message=message;
}

// Capture IDs when the user reviews the list. Recheck each target immediately before its operation.
function runNextInstance(job){
 if(batchForInstances()!==job || job.phase!=='running')return;
 const item=job.items.find(i=>i.status==='pending');
 if(!item){job.phase='done';updateInstanceBatchView(job);return;}
 function finish(status,message){
  if(batchForInstances()!==job || !['pending','running'].includes(item.status))return;
  recordBatchResult(item,status,message);
  if(job.items.some(i=>i.status==='pending'))setTimeout(()=>runNextInstance(job),260);
  else job.phase='done';
  updateInstanceBatchView(job);
 }
 const d=inst(item.id);
 if(!instanceBatchEligible(job.action,d)){finish('skipped',batchSkipReason(job.action,d));return;}
 const stopping=job.action==='stop',expected=stopping?'stopping':'starting';
 recordBatchResult(item,'running',stopping?'正在停止':'正在启动');
 if(stopping)runtimeStop(d.id,device=>{panelBootRefresh(device);finish('succeeded','已停止');});
 else{
  const issue=runtimeStart(d.id,()=>finish('succeeded','已启动'));
  if(issue){finish('failed',issue);return;}
 }
 panelBootRefresh(d);updateInstanceBatchView(job);
 // The owner of a single instance can interrupt its transition while the list is in the background.
 function observe(){
  if(batchForInstances()!==job || item.status!=='running')return;
  if(!inst(item.id))finish('skipped','实例已移除');
  else if(d.state!==expected)finish('failed',stopping?'停止已中断':'启动已中断');
  else setTimeout(observe,210);
 }
 setTimeout(observe,210);
}

function commitInstanceBatch(){
 const spec=S.overlay;
 if(spec?.kind!=='instance-batch-confirm' || S.page!=='instances' || batchForInstances()?.phase==='running')return;
 S.overlay=null;
 if(!spec.items.some(i=>i.eligible))return;
 runNextInstance(makeInstanceBatch(spec));
}
on('batch-commit',commitInstanceBatch);

function setupInstanceBatchScene(kind){
 const test=inst('test');
 if(kind==='confirm' && test){test.state='starting';test.rtStage=1;}
 if(kind==='start-confirm' && test)test.state='stopped';
 const action=kind==='start-confirm'?'start':'stop';
 if(!requestInstanceBatch(action,S.instances.map(d=>d.id),'all'))return;
 if(kind==='confirm'||kind==='start-confirm')return;
 if(kind==='progress'){commitInstanceBatch();return;}
 const spec=S.overlay;S.overlay=null;
 const job=makeInstanceBatch(spec);
 let advanced=0;
 for(const item of job.items){
  if(item.status==='skipped')continue;
  const d=inst(item.id);
  if(kind==='partial' && advanced===1){
   recordBatchResult(item,'failed','停止请求未获响应');
  }else{
   if(d){d.state='stopped';d.tasks={};d.deviceOpen=false;d.rtBoot=0;}
   recordBatchResult(item,'succeeded','已停止');
  }
  advanced++;
 }
 job.phase='done';
}

const listVerbs={start:'启动',stop:'停止'};
function selectedInstanceIds(){
 const current=new Set(S.instances.map(d=>d.id));
 return (S.instanceSelection||[]).filter(id=>current.has(id));
}
function listDeviceGlyph(d){
 const id=d&&runtimeTemplate(d).id;
 if(id==='tablet-1200')return 'tablet';
 if(id?.startsWith('tv'))return 'tv-minimal';
 return id?'smartphone':'monitor';
}
function listName(d,name,withTemplate=false){

 const label='<span class="list-device-icon">'+ico(listDeviceGlyph(d),16)+'</span><span class="list-identity"><strong>'+esc(name)+'</strong><small>'+esc(detail)+'</small></span>';
 return d?'<button type="button" class="list-name" data-action="select" data-value="'+esc(d.id)+'" title="打开「'+esc(name)+'」的应用库">'+label+'</button>':'<div class="list-name">'+label+'</div>';
}
function listState(d){
 const label=stateNames[d.state]||(d.state==='streaming'?'运行中':d.state);
 return '<span class="list-state" title="'+esc(panelStateText(d))+'"><i class="dot '+esc(d.state)+'"></i>'+esc(label)+'</span>';
}
function listSettings(d){
 return d?'<button class="list-settings" type="button" data-action="list-instance-settings" data-value="'+esc(d.id)+'" aria-label="'+esc(d.name)+'的实例设置" title="'+esc(d.name)+'的实例设置">设置</button>':'';
}
function listSpecs(d){
 const {cpuCores,ramMiB}=hardwareValues(d,true);
 const disk=d.diskGiB===undefined?8:d.diskGiB;
 return {
  cpu:Number.isSafeInteger(cpuCores)&&cpuCores>0?cpuCores+' 核':'待确认',
  memory:Number.isSafeInteger(ramMiB)&&ramMiB>0&&(d.ramMiB!=null||runtimeTemplate(d).ram!=null)?hardwareGiB(ramMiB)+' GiB':'待确认',
  disk:Number.isSafeInteger(disk)&&disk>0?disk+' GiB':'待确认',
  screen:displayResolution(d)
 };

function listMetric(column,label,value){
 return '<td class="list-metric list-'+column+'"><small class="list-inline-label">'+label+'</small><span>'+esc(value)+'</span></td>';
}
function listRow(d,chosen){
 const spec=listSpecs(d),template=runtimeTemplate(d);
 return '<tr data-id="'+esc(d.id)+'" data-selected="'+chosen+'"><td class="list-check"><input type="checkbox" data-instance-id="'+esc(d.id)+'" aria-label="选择'+esc(d.name)+'" '+(chosen?'checked':'')+'></td>'+
  '<td class="list-instance">'+listName(d,d.name)+'</td>'+listMetric('cpu','CPU',spec.cpu)+listMetric('memory','内存',spec.memory)+
  '<td class="list-display"><span>'+esc(spec.screen)+'</span><small>'+esc(template.name)+'</small></td>'+listMetric('disk','用户空间',spec.disk)+
  '<td class="list-status">'+listState(d)+'</td><td class="list-action">'+listSettings(d)+'</td></tr>';
}
function listOutcome(item){
 const fallback={pending:'等待处理',running:'进行中',succeeded:'已完成',skipped:'状态已变化',failed:'操作失败'};
 const icon={pending:'clock-3',running:'loader-circle',succeeded:'circle-check',skipped:'minus',failed:'circle-alert'};
 const text=(item.status==='skipped'?'已跳过 · ':item.status==='failed'?'失败 · ':'')+(item.message||fallback[item.status]);
 return '<span class="list-outcome '+item.status+'">'+ico(icon[item.status],14)+'<span>'+esc(text)+'</span></span>';
}
function listResultRow(item){
 const d=inst(item.id);
 return '<tr data-id="'+esc(item.id)+'" data-status="'+item.status+'"><td>'+listName(d,item.name,true)+'</td><td>'+listOutcome(item)+'</td><td class="list-action">'+listSettings(d)+'</td></tr>';
}
function listCommand(action,chosen,ids){
 const verb=listVerbs[action],allowed=ids.some(id=>instanceBatchEligible(action,inst(id)));
 return '<button type="button" class="btn list-command" data-action="list-'+action+'" aria-label="'+verb+(chosen?'选中的实例':'全部实例')+'" '+(allowed?'':'disabled')+'>'+ico(action==='stop'?'square':'play',13)+'<span>'+(chosen?'':'全部')+verb+'…</span></button>';
}
function listSelectionFooter(){
 const ids=selectedInstanceIds(),chosen=ids.length>0,target=chosen?ids:S.instances.map(d=>d.id);
 return '<span class="list-summary" aria-live="polite">'+(chosen?'已选 '+ids.length+' 个实例':'共 '+target.length+' 个实例')+'</span><div class="list-actions">'+listCommand('start',chosen,target)+listCommand('stop',chosen,target)+'</div>';
}
function listResultFooter(job){
 const count=s=>job.items.filter(i=>i.status===s).length;
 const ok=count('succeeded'),skip=count('skipped'),fail=count('failed'),active=job.phase==='running',verb=listVerbs[job.action];
 const label=active?'正在'+verb+' · '+(ok+skip+fail)+' / '+job.items.length:[ok?'已'+verb+' '+ok+' 个':'',skip?'跳过 '+skip+' 个':'',fail?'失败 '+fail+' 个':''].filter(Boolean).join(' · ');
 return '<span class="list-summary" role="status">'+esc(label||'操作已完成')+'</span>'+(!active?'<div class="list-actions">'+(fail?b('重试失败项','batch-retry','','plain','rotate-ccw'):'')+b('完成','batch-dismiss','',fail?'quiet':'plain')+'</div>':'');
}
function refreshInstanceList(){
 const page=document.querySelector('.instance-list-page'),job=batchForInstances(),table=page?.querySelector('.list-receipt');
 if(S.page!=='instances'||!job||!table)return;
 for(const row of table.tBodies[0].rows){
  const item=job.items.find(i=>i.id===row.dataset.id);
  if(item&&row.dataset.status!==item.status){row.cells[1].innerHTML=listOutcome(item);row.dataset.status=item.status;}
 }
 page.querySelector('.list-footer').innerHTML=listResultFooter(job);
}
function markInstanceSelection(){

const storageKey='windroid-prototype-storage-v1';
const storageData='~/.windroid';

const storageTitles={runtime:'运行组件',images:'系统镜像'};
let storageFallback={};

function readStoragePreferences(){
 if(S.storagePreview)return S.storagePreview;
 try{return JSON.parse(localStorage.getItem(storageKey)||'{}')||{};}catch{return storageFallback;}
}
function writeStoragePreferences(value){
 if(S.storagePreview){S.storagePreview=value;return;}
 storageFallback=value;
 try{localStorage.setItem(storageKey,JSON.stringify(value));}catch{}
}

 return {data:storageData,runtime,images:prefs.images||runtime+'/sdk/system-images'};

function storageRow(kind,title,path,detail,prefs){
 const reset=kind==='runtime'?'恢复默认':'跟随运行组件';
 const custom=Boolean(prefs[kind]);
 const choose=kind!=='data'?storageAction('更改…','storage-choose',kind,'更改'+title+'位置'):'';
 const control='<span class="storage-tools">'+ib('在 Finder 中显示'+title,'inspect-storage',kind,'folder-open')+choose+'</span>';
 const restore=custom?storageAction(reset,'storage-reset',kind,kind==='images'?reset:'恢复运行组件默认位置'):'';
 return '<div class="storage-row" data-storage="'+kind+'"><h3>'+title+(kind==='data'?'<span class="config-condition">固定位置</span>':'')+'</h3>'+control+'<div class="storage-path" title="'+esc(path)+'">'+esc(path)+'</div><div class="storage-detail"><span>'+detail+'</span>'+restore+'</div></div>';
}
function renderStorageSettings(){

 const rows=[
  storageRow('data','主数据目录',pos.data,'实例数据、快照与设置',{}),
  storageRow('runtime','运行组件',pos.runtime,prefs.runtime?'全部组件共用':'跟随主数据目录，全部组件共用',prefs),
  storageRow('images','系统镜像',pos.images,prefs.images?'单独存放':'跟随运行组件',prefs)
 ];
 const resume=draft?'<div class="storage-resume" role="status"><span>'+storageTitles[draft.key]+'的位置尚未更改。</span>'+storageAction('继续更改','storage-resume',draft.key)+storageAction('取消','storage-discard',draft.key)+'</div>':'';
 return '<div class="storage-fields" aria-label="存储位置">'+rows.join('')+'</div>'+resume;

function storageTarget(key,input){
 const path=input.trim().replace(/\/+$/,'').replace(/\/{2,}/g,'/');
 if(!path||(!path.startsWith('/')&&!path.startsWith('~/'))||/[\u0000-\u001f]/.test(path)||path.split('/').some(s=>s==='.'||s==='..'))return {error:'请输入完整的文件夹路径，例如 /Volumes/Studio/Windroid。'};
 if(path==='/Volumes'||path==='/Users'||path===storageData||storageData.startsWith(path+'/')||['instances','preferences','staging','cache'].some(s=>path===storageData+'/'+s||path.startsWith(storageData+'/'+s+'/')))return {error:'请选择用于存放'+storageTitles[key]+'的独立文件夹。'};
 if(path==='/Volumes/Archive'||path.startsWith('/Volumes/Archive/'))return {error:'Archive 未连接。请连接磁盘，或选择其他文件夹。'};
 const prefs=readStoragePreferences(),loc=storageLocations(prefs);
 const root=key==='runtime'?storageData+'/runtime':loc.runtime+'/sdk/system-images';
 const old=loc[key],existing=key==='runtime'?(S.env==='ready'||!prefs.images&&localImageIds().length>0):localImageIds().length>0;
 const nested=(a,b)=>a.startsWith(b+'/');
 if(existing&&(nested(path,old)||nested(old,path)))return {error:'原目录和新目录不能互相包含，请选择其他文件夹。'};
 if(key==='runtime'&&prefs.images&&nested(loc.images,path))return {error:'此文件夹包含单独设置的系统镜像目录，请选择其他文件夹。'};
 if(key==='runtime'&&(path===loc.images||path.startsWith(loc.images+'/'))||key==='images'&&(path===loc.runtime||loc.runtime.startsWith(path+'/')||['emulator','platform-tools','build-tools'].some(s=>path===loc.runtime+'/sdk/'+s||path.startsWith(loc.runtime+'/sdk/'+s+'/'))||path===loc.runtime+'/sdk'))return {error:'此位置与已有组件目录重叠，请选择单独的文件夹。'};
 return {path:path===root?null:path};
}
function storageNewPrefs(change){
 const prefs={...readStoragePreferences()};
 if(change.path)prefs[change.key]=change.path;else delete prefs[change.key];
 return prefs;
}
function storageChangeDetails(change){
 const old=storageLocations(),next=storageLocations(storageNewPrefs(change));
 const components=old.runtime!==next.runtime&&S.env==='ready';
 const images=old.images!==next.images?localImageIds().length:0;
 const active=S.instances.filter(d=>runtimeCanStop(d)||d.state==='stopping');
 const downloading=['downloading','verifying','installing','paused','failed'].includes(S.env)&&old.runtime!==next.runtime||Boolean(S.imageJob)&&old.images!==next.images;
 return {old,next,components,images,active,downloading};
}
function storageCommit(change){
 writeStoragePreferences(storageNewPrefs(change));
 S.overlay=null;delete S.storageDraft;
 notify('已更新'+storageTitles[change.key]+'位置。');
}
function storageReview(change){
 const checked=storageTarget(change.key,storageLocations(storageNewPrefs(change))[change.key]);
 if(checked.error){S.overlay={kind:'storage-error',error:checked.error};return;}
 change={key:change.key,path:checked.path};
 if((readStoragePreferences()[change.key]||null)===change.path){delete S.storageDraft;S.overlay=null;return;}
 const info=storageChangeDetails(change);
 if(!info.components&&!info.images&&!info.downloading){storageCommit(change);return;}
 S.overlay={kind:'storage-move',change};
}

// WebCrypto takes one complete ArrayBuffer. Stream the catalog's legacy SHA-1 in a
// worker so a multi-gigabyte archive never occupies that much memory in the UI.
function hashLocalArchive(){
 const rot=(n,b)=>(n<<b)|(n>>>(32-b));
 self.onmessage=async({data:file})=>{
  try{
   const h=new Uint32Array([0x67452301,0xefcdab89,0x98badcfe,0x10325476,0xc3d2e1f0]);
   const words=new Uint32Array(80);
   function blocks(buffer){
    const view=new DataView(buffer);
    for(let offset=0;offset<view.byteLength;offset+=64){
     for(let j=0;j<16;j++)words[j]=view.getUint32(offset+4*j,false);
     for(let j=16;j<80;j++)words[j]=rot(words[j-3]^words[j-8]^words[j-14]^words[j-16],1);
     let [a,b,c,d,e]=h;
     for(let t=0;t<80;t++){
      let f,k;
      if(t<20){f=(b&c)|(~b&d);k=0x5a827999;}
      else if(t<40){f=b^c^d;k=0x6ed9eba1;}
      else if(t<60){f=(b&c)|(b&d)|(c&d);k=0x8f1bbcdc;}
      else{f=b^c^d;k=0xca62c1d6;}
      const next=(rot(a,5)+f+e+k+words[t])>>>0;
      e=d;d=c;c=rot(b,30);b=a;a=next;
     }
     h[0]+=a;h[1]+=b;h[2]+=c;h[3]+=d;h[4]+=e;
    }
   }
   const aligned=file.size-file.size%64,chunk=4*1024*1024;
   let lastPercent=0;
   for(let start=0;start<aligned;start+=chunk){
    const end=Math.min(start+chunk,aligned);
    blocks(await file.slice(start,end).arrayBuffer());
    const progress=Math.min(99,Math.floor(100*end/file.size));
    if(progress!==lastPercent){lastPercent=progress;self.postMessage({progress});}
   }
   const residual=new Uint8Array(await file.slice(aligned).arrayBuffer());
   const tail=new Uint8Array(residual.length<56?64:128);
   tail.set(residual);tail[residual.length]=0x80;
   const length=new DataView(tail.buffer);
   length.setUint32(tail.length-8,Math.floor(file.size/0x20000000),false);
   length.setUint32(tail.length-4,file.size*8,false);blocks(tail.buffer);
   self.postMessage({digest:Array.from(h,n=>n.toString(16).padStart(8,'0')).join('')});
  }catch{self.postMessage({failed:true});}
 };
}
let localReader=null;
function cancelLocalRead(){
 if(!localReader)return;
 localReader.worker.terminate();URL.revokeObjectURL(localReader.url);localReader=null;
}
on('local-image-abort',()=>{cancelLocalRead();S.overlay=null;});
function failLocalImage(state,message){state.kind='local-image-error';state.issue=message;render();}
async function checkLocalImage(file){
 cancelLocalRead();const state={kind:'local-image-check',fileName:file.name,progress:0};
 S.overlay=state;render();
 try{
  const magic=new Uint8Array(await file.slice(0,4).arrayBuffer());
  if(S.overlay!==state)return;
  if(magic.length!==4||magic[0]!==0x50||magic[1]!==0x4b||magic[2]!==3||magic[3]!==4){failLocalImage(state,'文件不是受支持的 ZIP 镜像包。');return;}
  if(file.size!==localArchiveProfile.bytes){failLocalImage(state,'文件大小与内置清单中的镜像不符。');return;}
  const url=URL.createObjectURL(new Blob(['('+hashLocalArchive.toString()+')()'],{type:'text/javascript'}));
  let worker;try{worker=new Worker(url);}catch(error){URL.revokeObjectURL(url);throw error;}
  localReader={worker,url};
  worker.onerror=()=>{if(localReader?.worker!==worker)return;cancelLocalRead();if(S.overlay===state)failLocalImage(state,'未能读取完整的镜像文件。');};
  worker.onmessage=({data})=>{
   if(localReader?.worker!==worker)return;
   if(S.overlay!==state){cancelLocalRead();return;}
   if(data.progress!==undefined){
    state.progress=data.progress;const meter=document.getElementById('li-meter');
    if(meter){meter.setAttribute('aria-valuenow',data.progress);meter.firstElementChild.style.width=data.progress+'%';document.getElementById('li-percent').textContent=data.progress+'%';}
    return;
   }
   cancelLocalRead();
   if(data.failed||data.digest!==localArchiveProfile.sha1){
    failLocalImage(state,data.failed?'未能读取完整的镜像文件。':'文件校验和与内置清单不符。');return;
   }
   state.kind=localImageIds().includes(localArchiveProfile.id)?'local-image-existing':'local-image-ready';render();
  };
  worker.postMessage(file);
 }catch{cancelLocalRead();if(S.overlay===state)failLocalImage(state,'未能读取完整的镜像文件。');}
}

// Native host probes provide logical CPUs, physical RAM and the per-VM HVF cap.
// CPU and capacity match the reference M4. Pressure and guest headroom are design fixtures.
// https://developer.apple.com/documentation/hypervisor/hv_vm_get_max_vcpu_count(_:)
// GICv2 has eight CPU interfaces. A different machine supplies its own limit.
// https://android.googlesource.com/platform/external/qemu/+/85fa07f04ef62b698792169062c3b13e6415469c/hw/arm/virt.c#1367
const previewHardwareEnvironment={
 host:{logicalCores:10,ramMiB:16*1024,maxVcpusPerVm:64},
 admission:{pressure:'normal',additionalMiB:4096,reservedAtSampleMiB:7168},
 machine:{emulatorVersion:'37.2.13',emulatorBuild:'16740729',arch:'aarch64',model:'virt',interruptController:'GICv2',maxVcpus:8,maxRamMiB:31*1024}
};
function hardwareEnvironment(){return S.hardwareEnvironment||previewHardwareEnvironment;}
function hardwareCpuLimit(environment=hardwareEnvironment()){
 const limits=[64,environment.host?.logicalCores,environment.host?.maxVcpusPerVm,environment.machine?.maxVcpus];
 return limits.every(n=>Number.isInteger(n)&&n>0)?Math.min(...limits):0;
}
function hardwareCpuError(cores){
 const limit=hardwareCpuLimit();
 if(!limit)return '未取得本机与模拟器的处理器规格。';
 if(hardwareEnvironment().host.logicalCores<2)return '运行此镜像的 Mac 至少需要 2 个逻辑核心。';
 if(Number.isInteger(cores)&&cores>=1&&cores<=limit)return '';
 return '当前配置可分配 1 至 '+limit+' 个虚拟核心，请输入整数。';
}
function hardwarePhysicalMiB(){
 const physical=hardwareEnvironment().host?.ramMiB;
 return Number.isInteger(physical)&&physical>0?physical:0;
}
// Windroid reserves at most half of physical memory for all active guests.
function hardwareBudgetMiB(){return Math.floor(hardwarePhysicalMiB()/2);}
// Apple Silicon's ARM virt memory map also caps one guest independently.
// https://android.googlesource.com/platform/external/qemu/+/8aaadeb1fea1202b287f1b8361f764a98950a27e/hw/arm/virt.c#125
function hardwareMemoryLimitMiB(){
 const max=hardwareEnvironment().machine?.maxRamMiB;
 return Number.isInteger(max)&&max>0?Math.min(max,hardwareBudgetMiB()):0;
}
function hardwareGiB(mib){return Number((mib/1024).toFixed(3));}

function hardwareProfile(record){
 const machine=hardwareEnvironment().machine;
 if(machine?.emulatorVersion!=='37.2.13'||machine.emulatorBuild!=='16740729'||machine.arch!=='aarch64')
  return {minimumMiB:null,issue:'尚未确认此运行环境的内存要求。'};
 // The native resolver reads the AVD target and the image's build.prop flavor.
 // https://android.googlesource.com/platform/external/qemu/+/8aaadeb1fea1202b287f1b8361f764a98950a27e/android/emu/avd/src/android/avd/info.c#1060
 const image=imageById(deviceImageId(record));
 if(!Number.isSafeInteger(image.api)||image.api<29||image.abi!=='arm64-v8a'||
    !['phone','other','tv','wear','xr','car','desktop','glasses'].includes(image.flavor))
  return {minimumMiB:null,issue:'镜像规格未识别，无法确认内存下限。'};
 // Match the effective primary display and foldable settings, including a saved
 // AVD's resolved display when its original template is no longer in the list.
 const {width,height,foldable}=record.avdDisplay??runtimeTemplate(record);
 if(!Number.isSafeInteger(width)||width<=0||!Number.isSafeInteger(height)||height<=0||typeof foldable!=='boolean')
  return {minimumMiB:null,issue:'缺少设备的屏幕配置，无法确认内存下限。'};
 // Upstream 37.2.12; the API 34 size boundary was checked on build 16740729.
 // https://android.googlesource.com/platform/external/qemu/+/8aaadeb1fea1202b287f1b8361f764a98950a27e/android/android-emu/android/main-common.c#1266
 let minimumMiB=image.api>=37?4096:image.api>=34?2560:2048;
 if(image.api>=33&&(foldable||width*height>=3000000))minimumMiB=4096;
 if(image.flavor==='tv')minimumMiB=1024;
 if(image.flavor==='wear')minimumMiB=2048;
 if(image.flavor==='xr')minimumMiB=4096;
 return {minimumMiB,issue:''};
}
function hardwareValues(record,existing=false){
 const templateRam=runtimeTemplate(record).ram;
 const minimum=hardwareProfile(record).minimumMiB;
 const defaultRam=templateRam===null?null:templateRam*1024;
 return {
  cpuCores:record.cpuCores??(existing?2:Math.min(2,hardwareCpuLimit())||2),
  ramMiB:record.ramMiB??(existing||minimum===null?defaultRam:Math.max(defaultRam??0,minimum))
 };
}
function assignInstanceHardware(device,draft){
 Object.assign(device,hardwareValues(draft));
}
function hardwareEffectiveMiB(device){
 const minimum=hardwareProfile(device).minimumMiB;
 const configured=hardwareValues(device,true).ramMiB;
 return minimum===null||!Number.isSafeInteger(configured)||configured<=0?NaN:Math.max(configured,minimum);
}
function hardwareCommittedMiB(d){
 return d.actualRamMiB>0?d.actualRamMiB:hardwareEffectiveMiB(d);
}
function hardwareUsage(exclude=null){
 const active=S.instances.filter(i=>i!==exclude&&(i.processAlive===true||['starting','stalled','ready','streaming','stopping'].includes(i.state)));
 const amounts=active.map(hardwareCommittedMiB);
 const memory=amounts.every(n=>Number.isFinite(n)&&n>0)?amounts.reduce((sum,n)=>sum+n,0):null;
 const coreCounts=active.map(i=>i.actualCpuCores??hardwareValues(i,true).cpuCores);
 const cores=coreCounts.every(n=>Number.isInteger(n)&&n>0)?coreCounts.reduce((sum,n)=>sum+n,0):null;
 return {count:active.length,memory,cores};
}
// A sample excludes existing guest commitments. Track grants against that
// sample so an older guest's exit cannot hide a newly admitted guest.
function unobservedGuestMiB(sample,used){
 const ledger=S.memoryReservations;
 return Math.max(0,used-sample.reservedAtSampleMiB,ledger?.sample===sample?ledger.amount:0);
}
function reserveGuestMemory(d){
 const sample=hardwareEnvironment().admission,amount=hardwareEffectiveMiB(d);
 S.memoryReservations={sample,amount:unobservedGuestMiB(sample,hardwareUsage().memory)+amount};
 d.memoryReservation={sample,amount};
}
function releaseGuestMemory(d){
 const grant=d.memoryReservation,ledger=S.memoryReservations;
 if(grant&&ledger?.sample===grant.sample)ledger.amount=Math.max(0,ledger.amount-grant.amount);
 delete d.memoryReservation;
}
// A native admission check takes a fresh sample. The pressure level alone has no byte value.
// https://developer.apple.com/documentation/dispatch/dispatch_source_memorypressure_flags_t
function hardwareRemainingMiB(used=hardwareUsage().memory,plannedMiB=0){
 const sample=hardwareEnvironment().admission;
 if(!Number.isFinite(used)||sample?.stale||!['normal','warning','critical'].includes(sample?.pressure)||
    !Number.isFinite(sample?.additionalMiB)||sample.additionalMiB<0||
    !Number.isFinite(sample?.reservedAtSampleMiB)||sample.reservedAtSampleMiB<0)return null;
 const newReservations=unobservedGuestMiB(sample,used-plannedMiB)+plannedMiB;
 return Math.max(0,Math.min(hardwareBudgetMiB()-used,sample.additionalMiB-newReservations));
}
function hardwareStartAdvisory(){
 return hardwareEnvironment().admission?.pressure==='warning'?'本机内存压力较高。':'';
}
function instanceStartHint(d){
 if(!runtimeCanStart(d)||S.env!=='ready')return '';
 return runtimeStartBlock(d)||hardwareStartAdvisory();
}
function instanceStartButton(d,withIcon=false){
 if(S.env==='ready'&&runtimeStartBlock(d))return b('重新检查','admission-recheck',d.id,'plain');
 const frozen=d.state==='frozen',verb=frozen?'恢复实例':d.state==='failed'?'重新启动':'启动实例';
 return b(verb,frozen?'resume-instance':'start-instance',d.id,'primary',withIcon?'play':null);
}
on('admission-recheck',id=>{
 const d=inst(id);if(!runtimeCanStart(d))return;
 const issue=runtimeStartPreflight(d);
 notify(issue||'资源已就绪，可以启动。');
});
function hardwareValueError(record,values,previous){
 const {minimumMiB:min,issue}=hardwareProfile(record);
 if(issue)return issue;
 const cpuIssue=hardwareCpuError(values.cpuCores);
 if(cpuIssue)return cpuIssue;
 const max=hardwareMemoryLimitMiB();
 if(!max)return '未取得本机与模拟器的内存规格。';
 if(max<min)return '本机可为单个实例分配 '+hardwareGiB(max)+' GiB，此配置至少需要 '+hardwareGiB(min)+' GiB。';
 if(!Number.isInteger(values.ramMiB)||values.ramMiB>max||(values.ramMiB<min&&previous?.ramMiB!==values.ramMiB))return '此配置可分配 '+hardwareGiB(min)+' 至 '+hardwareGiB(max)+' GiB 内存。';
 return '';
}
function hardwareCreateError(draft){
 return hardwareValueError(draft,hardwareValues(draft));
}
function hardwareStartBudgetError(d,usage,replacing=false){
 const spec=hardwareValues(d,true),bounds=hardwareValueError(d,spec,spec);
 if(bounds)return bounds;
 return hardwareAdmissionError(usage,spec.cpuCores,hardwareEffectiveMiB(d),replacing?hardwareCommittedMiB(d):0);
}
function hardwareAdmissionError(usage,cores,requested,replacedMiB=0){
 const env=hardwareEnvironment(),sample=env.admission;
 if(sample?.pressure==='critical'&&!sample.stale)return '本机内存压力过高，无法启动。';
 if(usage.cores===null)return '尚未取得运行实例的核心数，请重试。';
 const cpuFree=Math.max(0,env.host.logicalCores-usage.cores);
 if(cores>cpuFree)return '启动需要 '+cores+' 核，当前可分配 '+cpuFree+' 核。';
 if(!Number.isFinite(usage.memory)||!Number.isFinite(replacedMiB))return '尚未取得运行实例的内存分配，请重试。';
 const poolFree=Math.max(0,hardwareBudgetMiB()-usage.memory);
 if(requested>poolFree)return '启动需要 '+hardwareGiB(requested)+' GiB，共享额度剩余 '+hardwareGiB(poolFree)+' GiB。';
 // A restart replaces its existing guest. Before stopping it, check only its
 // additional needs. After process exit the full start check runs again.
 const remaining=hardwareRemainingMiB(usage.memory+replacedMiB,usage.plannedMiB);
 if(remaining===null)return '未取得当前可用内存，请重试。';
 return requested>remaining+replacedMiB?'启动需要 '+hardwareGiB(requested)+' GiB，当前可分配 '+hardwareGiB(remaining+replacedMiB)+' GiB。':'';
}
function hardwareResourceDetails(record,values){
 const usage=hardwareUsage(),env=hardwareEnvironment(),free=hardwareRemainingMiB(usage.memory);
 const {minimumMiB:min,issue}=hardwareProfile(record),max=hardwareMemoryLimitMiB();
 if(issue)return '<small class="hw-budget-note">'+esc(issue)+'</small>';
 if(!hardwareCpuLimit()||!max)return '<small class="hw-budget-note">暂时无法读取本机硬件规格。</small>';
 if(env.host.logicalCores<2)return '<small class="hw-budget-note">运行此镜像至少需要双核 Mac。</small>';
 if(max<min)return '<small class="hw-budget-note">本机最多可分配 '+hardwareGiB(max)+' GiB，此配置至少需要 '+hardwareGiB(min)+' GiB。</small>';
 const info='本机 '+env.host.logicalCores+' 个逻辑核 · '+hardwareGiB(env.host.ramMiB)+' GiB 内存';
 const limits='单实例可设 1–'+hardwareCpuLimit()+' 核、'+hardwareGiB(min)+'–'+hardwareGiB(max)+' GiB 内存。';
 const active='已分配 '+(usage.cores??'—')+' / '+env.host.logicalCores+' 核 · '+(usage.memory===null?'—':hardwareGiB(usage.memory))+' / '+hardwareGiB(hardwareBudgetMiB())+' GiB';
 const headroom=free!==null&&free<hardwareBudgetMiB()-usage.memory?'。当前可再分配 '+hardwareGiB(free)+' GiB。':'';
 const previous=S.overlay?.kind==='hardware-edit'?hardwareValues(record,true):null;
 const valid=!hardwareValueError(record,values,previous);
 const blocked=valid?hardwareAdmissionError(usage,values.cpuCores,Math.max(min,values.ramMiB)):'';
 const warning=blocked?'可保存配置。'+blocked:valid?hardwareStartAdvisory():'';
 return '<details class="hw-resources"'+(S.hardwareDetailsOpen?' open':'')+'><summary>本机可用资源</summary><p>'+info+'</p><p>'+limits+'</p><p>'+active+headroom+'</p></details>'+
  (warning?'<small class="hw-budget-note">'+warning+'</small>':'');
}
function hardwareInputs(values,record,dialog){
 const ui=dialog?S.overlay:record, minRam=hardwareProfile(record).minimumMiB,maxRam=hardwareMemoryLimitMiB();
 function picker(id,label,unit,current,min,max,presets,divisor,custom){
  if(min===null||max<min)return '<div class="hw-field"><label for="'+id+'-preset">'+label+'</label><select disabled class="rt-control hw-picker" id="'+id+'-preset"><option>'+(min===null?'待确认':max?'容量不足':'规格未知')+'</option></select></div>';
  const choices=[...new Set([min,...presets])].filter(n=>n>=min&&n<=max).sort((a,b)=>a-b);
  const manual=custom||!choices.includes(current), fmt=n=>divisor===1024?hardwareGiB(n):n;
  const options=choices.map(n=>'<option value="'+n+'"'+(!manual&&n===current?' selected':'')+'>'+fmt(n)+' '+unit+'</option>').join('');
  const select='<select class="rt-control hw-picker" id="'+id+'-preset" aria-label="'+label+'">'+options+'<option value="custom"'+(manual?' selected':'')+'>自定义…</option></select>';
  const description=dialog?' aria-describedby="hw-hint"':'';
  const field=manual?'<span class="hw-number"><input class="rt-control" id="'+id+'" type="number" min="'+fmt(min)+'" max="'+fmt(max)+'" step="'+(divisor===1?'1':'any')+'" value="'+(current===''?'':fmt(current))+'" aria-label="自定义'+label+'"'+description+'><span>'+unit+'</span></span>':'';
  return '<div class="hw-field"><label for="'+id+'-preset">'+label+'</label>'+select+field+'</div>';
 }
 return '<div class="hw-inputs'+(dialog?' hw-dialog-inputs':'')+'">'+
 picker('hw-cpu','处理器','核',values.cpuCores,1,hardwareCpuLimit(),[2,4,6,8,12,16,24,32,48,64],1,ui.customCores)+
 picker('hw-memory','内存','GiB',values.ramMiB,minRam,maxRam,[2048,3072,4096,6144,8192,12288,16384,24576,32768,65536],1024,ui.customMemory)+'</div>'+
 '<div data-hw-resources>'+hardwareResourceDetails(record,values)+'</div>';
}
function canAllocateHardware(draft){
 const min=hardwareProfile(draft).minimumMiB;
 return min!==null&&!hardwareCpuError(1)&&hardwareMemoryLimitMiB()>=min;
}
function refreshHardwareAvailability(){
 const o=S.overlay,dialog=o?.kind==='hardware-edit';
 const record=dialog?inst(o.id):S.page==='create'&&!o?createDraft():null;
 const hints=document.querySelector('[data-hw-resources]');
 if(!record||!hints)return;
 const values=dialog?o.values:hardwareValues(record);
 hints.innerHTML=hardwareResourceDetails(record,values);
}
function hardwareCreateFields(draft){
 const values=hardwareValues(draft);
 return '<div class="hw-create">'+hardwareInputs(values,draft,false)+'</div>';
}
function hardwareCanEdit(d){
 // State::Failed is derived only after observing process_alive == false.
 // A newer explicit process observation takes precedence over an older state.
 return !!d&&d.processAlive!==true&&['stopped','frozen','failed'].includes(d.state);
}
function hardwareEdit(id){
 const device=inst(id);
 if(!hardwareCanEdit(device)||S.page!=='manage'||cur()!==device)return;
 S.overlay={kind:'hardware-edit',id,values:{...hardwareValues(device,true)},graphics:device.graphics||'host',error:''};
}
on('hw-edit',hardwareEdit);
overlays['hardware-edit']=()=>{
 const o=S.overlay,d=inst(o.id);
 if(!d)return '';
 const impact=d.state==='frozen'?'下次将跳过当前快照，已安装的应用和文件会保留。':'下次启动时生效。';
 const prior=hardwareValues(d,true);
 const minimum=hardwareProfile(d).minimumMiB;
 const inherited=minimum!==null&&prior.ramMiB!==null&&prior.ramMiB<minimum&&o.values.ramMiB===prior.ramMiB?'<p class="hw-legacy">此实例原设 '+hardwareGiB(prior.ramMiB)+' GiB。当前配置至少需要 '+hardwareGiB(minimum)+' GiB。</p>':'';
 const graphics='<label class="ops-choice hw-graphics">图形渲染<select id="instance-renderer" class="rt-control">'+choiceOptions(graphicsChoices,o.graphics)+'</select></label>';
 const body='<p class="hw-context">'+esc(d.name)+'</p>'+hardwareInputs(o.values,d,true)+graphics+inherited+'<p class="hw-impact" id="hw-hint">'+impact+'</p>'+(o.error?'<p class="rt-error" role="alert">'+esc(o.error)+'</p>':'');
 return sheet('调整硬件配置',body,b('取消','rt-dismiss','','plain')+b('保存','hw-save',d.id,'primary')).replace('class="dialog-card"','class="dialog-card hw-dialog"');
};
on('hw-save',id=>{
 const o=S.overlay,d=inst(id);
 if(o?.kind!=='hardware-edit'||o.id!==id||cur()!==d)return;
 if(!hardwareCanEdit(d)){o.error='请在实例完全停止后保存。';return;}
 const prev=hardwareValues(d,true);
 if(prev.cpuCores===o.values.cpuCores&&prev.ramMiB===o.values.ramMiB&&(d.graphics||'host')===o.graphics){S.overlay=null;return;}
 o.error=hardwareValueError(d,o.values,prev);if(o.error)return;
 if(!Object.hasOwn(graphicsChoices,o.graphics)){o.error='请选择图形渲染方式。';return;}
 Object.assign(d,o.values,{graphics:o.graphics,coldBootPending:true,state:'stopped'});
 // Saved disk content stays with the instance. A frozen process snapshot is no
 // longer eligible for restoring tasks under the previous hardware profile.
 d.tasks={};d.deviceOpen=false;
 delete d.actualRamMiB;delete d.actualCpuCores;
 S.overlay=null;
 notify('硬件配置已保存');
});
document.addEventListener('input',e=>{

 const o=S.overlay;
 const target=o?.kind==='hardware-edit'?o.values:S.page==='create'&&!o?createDraft():null;
 if(!target)return;
 const value=e.target.value===''?'':Number(e.target.value);
 if(e.target.id==='hw-cpu')target.cpuCores=value;
 else target.ramMiB=value===''?'':Math.round(value*1024);
 if(o){o.error='';if(e.target.id==='hw-memory')e.target.closest('.dialog-body')?.querySelector('.hw-legacy')?.remove();}else target.error='';
 e.target.closest('form,.dialog-body')?.querySelector('.rt-error')?.remove();
 const hints=document.querySelector('[data-hw-resources]');
 if(hints)hints.innerHTML=hardwareResourceDetails(o?inst(o.id):target,o?target:hardwareValues(target));
});
document.addEventListener('change',e=>{

 ui[cpu?'customCores':'customMemory']=custom;
 if(!custom)(o?o.values:ui)[cpu?'cpuCores':'ramMiB']=Number(e.target.value);
 ui.error='';
 render();
 const focus=document.getElementById(custom?id.replace('-preset',''):id);
 focus?.focus({preventScroll:true});if(custom)focus?.select();
});
document.addEventListener('toggle',e=>{if(e.target.matches?.('.hw-resources')&&e.target.isConnected)S.hardwareDetailsOpen=e.target.open;},true);
document.addEventListener('keydown',e=>{

// The instance settings contain requested values. A launch may also provide an

function configGroup(label,condition,body,action=''){

function manageHardwareSection(d){
 const configured=hardwareValues(d,true);
 const running=['ready','streaming'].includes(d.state);
 const observedCores=running&&Number.isInteger(d.actualCpuCores)&&d.actualCpuCores>0?d.actualCpuCores:null;
 const observedMemory=running&&Number.isFinite(d.actualRamMiB)&&d.actualRamMiB>0?d.actualRamMiB:null;
 const cpuNote=observedCores!==null&&observedCores!==configured.cpuCores?'原设 '+configured.cpuCores+' 核':'';
 let memoryNote='';
 if(observedMemory!==null&&configured.ramMiB!==null&&observedMemory!==configured.ramMiB){
  memoryNote='原设 '+hardwareGiB(configured.ramMiB)+' GiB，启动时'+(observedMemory>configured.ramMiB?'调高':'调低');
 }
 const edit=hardwareCanEdit(d);
 const action=edit?b('调整…','hw-edit',d.id,'quiet mg-link'):'';
 let status='';
 if(edit){
  if(d.coldBootPending)status='下次启动将跳过快照';
 }else{
  const exiting=d.state==='stopping'||(d.processAlive===true&&['stopped','frozen','failed'].includes(d.state));
  status=exiting?'正在等待实例退出':'调整前请先停止实例';
 }
 const rows='<dl class="mg-info">'+
  manageHardwareMetric('cpu','处理器',observedCores??configured.cpuCores,'核',cpuNote)+
  (observedMemory===null&&configured.ramMiB===null?manageHardwareMetric('memory','内存','待确认','',''):
   manageHardwareMetric('memory',observedMemory===null?'内存':'本次分配内存',hardwareGiB(observedMemory??configured.ramMiB),'GiB',memoryNote))+
  '<div class="mg-info-row"><dt>图形渲染</dt><dd>'+esc(graphicsChoices[d.graphics]||graphicsChoices.host)+'</dd></div></dl>';
 return configGroup('硬件配置',status,rows,action);
}

 if(!open[pkg]){
  const pref=windowDefaults(),[w,h]=runtimeTemplate(d).display.split(' × ').map(Number);
  const wide=pref.direction==='landscape'||pref.direction==='template'&&w>h;
  open[pkg]=data.savedFrames?.[pkg]||{w:Math.round(pref.height*(wide?16/9:9/16)),h:pref.height};

function resizeAppFrame(el,w,h){
 const [d,key]=wxTarget(el.dataset.wxWindow);if(!d||key===wxDevice)return;
 const data=wxData(d);
 const frame={w:Math.max(200,Math.min(Math.round(w),Math.floor((el.parentElement.clientWidth-22)/.65))),h:Math.max(180,Math.min(Math.round(h),Math.floor((el.parentElement.clientHeight-20)/.65)))};
 (data.savedFrames||={})[appPackage(key)]=frame;(data.openFrames||={})[appPackage(key)]=frame;

document.addEventListener('pointerdown',e=>{
 const handle=e.target.closest('[data-frame-grip]');if(!handle||e.button!==0)return;
 const el=handle.closest('.wx-window'),rect=el.getBoundingClientRect(),scale=rect.width/el.offsetWidth;
 const x=e.clientX,y=e.clientY,w=el.offsetWidth,h=el.offsetHeight;
 handle.setPointerCapture(e.pointerId);e.preventDefault();
 const move=event=>resizeAppFrame(el,(w+(x-event.clientX)/scale)/.65,(h+(event.clientY-y)/scale)/.65);

// The review scenes use fixed local timestamps. Normal workspace actions use the host offset at capture.
function logTimestamp(now=new Date()){
 const pad=value=>String(Math.abs(value)).padStart(2,'0'),offset=-now.getTimezoneOffset();
 return now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())+'T'+pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds())+(offset<0?'-':'+')+pad(Math.floor(Math.abs(offset)/60))+':'+pad(Math.abs(offset)%60);
}
function appendPreviewLog(run,source,message,at=logTimestamp(),context={}){
 const day=at.slice(0,10);
 let part=run.parts.at(-1);
 if(part?.day!==day){part={day,number:run.parts.length+1,entries:[]};run.parts.push(part);}
 part.entries.push({at,source,message,...context});
}
let previewRunSerial=0;
function beginPreviewRun(runs,started=logTimestamp(),id=globalThis.crypto?.randomUUID?.()||'preview-'+Date.now()+'-'+(++previewRunSerial)){
 const run={id,started,status:'active',parts:[]};runs.push(run);return run;
}
function previewLogRuns(device){
 const owner=device||S;
 if(owner.logRuns)return owner.logRuns;
 const runs=owner.logRuns=[];
 if(S.liveLogWorkspace||device&&(device.neverStarted||!['daily','test','phone-check','tablet-check'].includes(device.id)))return runs;
 const source=device?'emulator-'+device.id:'app',day1='2026-11-18T',day2='2026-11-19T';
 const at=(date,time)=>date+time+'+08:00';
 const add=(run,date,time,level,message)=>appendPreviewLog(run,level,message,at(date,time));
 if(!device||device.id==='daily'){
  const previous=beginPreviewRun(runs,at(day1,'23:58:02'),source+'-001');
  add(previous,day1,'23:58:02',device?'host':'INFO',device?'正在启动 Android Emulator。':'Windroid 已启动。');
  add(previous,day1,'23:58:08',device?'stdout':'INFO',device?'Android boot completed.':'已载入运行组件清单。');
  add(previous,day2,'00:00:03',device?'stdout':'INFO',device?'Guest display connected.':'运行组件检查完成。');
  add(previous,day2,'00:12:04',device?'host':'INFO',device?'模拟器进程已退出。':'Windroid 正常退出。');
  previous.status='ended';
 }
 const start=(!device||device.id==='daily')?'09:10:03':device.id==='test'?'09:20:11':device.id==='phone-check'?'09:32:14':'10:02:16';
 const latest=beginPreviewRun(runs,at(day2,start),source+'-002');
 const after=sec=>start.slice(0,6)+String(Number(start.slice(-2))+sec).padStart(2,'0');
 if(!device){
  add(latest,day2,start,'INFO','Windroid 已启动。');
  add(latest,day2,after(1),'INFO','已载入实例列表。');
 }else{
  add(latest,day2,start,'host','正在启动 Android Emulator。');
  add(latest,day2,after(1),'stdout','Android emulator version 37.2.13.0');
  if(device.state==='failed'){
   add(latest,day2,after(2),'stderr','ERROR | Failed to initialize graphics backend.');
   add(latest,day2,after(2),'host','模拟器进程已退出，退出码 1。');latest.status='failed';
  }else{
   if(device.actualRamMiB===2560&&Number(device.ramMiB)<2560)add(latest,day2,after(1),'stdout','INFO | Increasing RAM size to 2560MB');
   add(latest,day2,after(5),'host','Android 实例已就绪。');
   if(['stopped','frozen'].includes(device.state)&&!device.processAlive){add(latest,day2,after(20),'host','模拟器进程已退出。');latest.status='ended';}
  }
 }
 return runs;
}
function recordAppLog(level,message,device,emulatorRunId){
 const runs=previewLogRuns(null);
 let current=runs.at(-1);
 if(current?.status!=='active')current=beginPreviewRun(runs);

function logDate(day,year=false){

const logRunStates={active:'运行中',ended:'已结束',failed:'启动失败',unknown:'退出原因未知'};

 const duplicates=peers.filter(other=>other.started===run.started);
 const counter=duplicates.length>1?' · 第 '+(duplicates.indexOf(run)+1)+' 次':'';
 const year=runs.some(other=>other.started.slice(0,4)!==run.started.slice(0,4));

function logReaderState(device){
 const runs=previewLogRuns(device);
 const days=[...new Set(runs.flatMap(run=>run.parts.map(part=>part.day)))].sort().reverse();
 const key=device?'emulator/'+device.id:'app';
 const filter=(S.logFilters||={})[key]||={mode:'day'};
 if(!days.includes(filter.day))filter.day=days[0];
 if(!runs.some(run=>run.id===filter.runId))filter.runId=runs.at(-1)?.id;

  const match=runs.find(run=>run.id===value);
  filter.runId=(match||(previous?.parts.some(part=>part.day===filter.day)?previous:runs.filter(run=>run.parts.some(part=>part.day===filter.day)).at(-1))||previous)?.id;
 }else{
  filter.day=value||(previous&&!previous.parts.some(part=>part.day===filter.day)?previous.parts.at(-1)?.day:filter.day);

function renderLogReader(device){

 const menu=byDay?days.map(day=>[day,logDate(day,true)]):runs.slice().reverse().map(run=>[run.id,logStartLabel(run,runs)+' · '+logRunStates[run.status]]);

 }).join('');
 const renderGroup=(run,parts)=>{

 });
 if(snapshot===lastWorkspaceSnapshot)return;
 try{localStorage.setItem(workspaceKey,snapshot);lastWorkspaceSnapshot=snapshot;}catch{}
}
window.addEventListener('pagehide',event=>{
 if(!persistentWorkspace)return;
 const current=S.logRuns?.at(-1);
 if(!event.persisted&&current?.status==='active'){
  for(const d of S.instances){
   const run=d.logRuns?.at(-1);
   if(run?.status==='active'&&run.appRunId===current.id){
    appendPreviewLog(run,'host','Windroid 退出，模拟器进程已停止。');run.status='ended';
   }
  }
  appendPreviewLog(current,'INFO','Windroid 正常退出。');current.status='ended';
 }
 saveFirstUseWorkspace();
});
function openFirstUseWorkspace(showWelcome){
 runtimeResetFirst();let saved;
 try{saved=JSON.parse(localStorage.getItem(workspaceKey)||'null');}catch{}
 if(saved&&typeof saved==='object'){
  if(['ready','missing','failed'].includes(saved.env))S.env=saved.env;
  else if(['downloading','verifying','installing','paused'].includes(saved.env))S.env='paused';
  S.rtProgress=Math.max(0,Math.min(100,Number(saved.progress)||0));
  S.rtImages=Array.isArray(saved.images)?saved.images.filter(id=>creationImages.some(i=>i.id===id)):[];
  S.instances=(Array.isArray(saved.instances)?saved.instances:[]).filter(d=>d&&typeof d.id==='string'&&typeof d.name==='string').map(d=>({...newInstance(d.id,d.name,d.template),...savedInstanceConfig(d)}));
  S.selected=S.instances.some(d=>d.id===saved.selected)?saved.selected:S.instances[0]?.id??null;
  if(saved.imageJob&&creationImages.some(i=>i.id===saved.imageJob.id)&&!S.rtImages.includes(saved.imageJob.id)){
   S.imageJob={id:saved.imageJob.id,progress:Math.max(0,Math.min(99,Number(saved.imageJob.progress)||0)),paused:true,create:false};
  }
 }
 S.liveLogWorkspace=true;S.logRuns=Array.isArray(saved?.appLogRuns)?saved.appLogRuns:[];
 for(const owner of [S,...S.instances]){
  if(!Array.isArray(owner.logRuns))owner.logRuns=[];
  for(const run of owner.logRuns)if(run.status==='active')run.status='unknown';
 }
 const appRun=beginPreviewRun(S.logRuns);appendPreviewLog(appRun,'INFO','Windroid 已启动。');
 const existingWorkspace=saved?.presented===true||S.instances.length>0||S.rtImages.length>0||S.env!=='missing'||!!S.imageJob;
 persistentWorkspace=true;S.review='first-direct';
 if(S.selected){S.workspaceOpen=true;S.review='library';go('panel');}
 else if(showWelcome&&!existingWorkspace){S.review='first-welcome';startWelcome();}
 else go('instances');
 if(innerWidth<650)S.collapsed=true;
 render();
}
function startWelcome(){
 if(S.setupStep&&S.page==='settings'){returnFromPreferences();return;}
 S.setupOrigin=S.page==='settings'?{page:'settings',tab:S.settingsTab,prefsOrigin:S.prefsOrigin}:{page:'instances'};
 S.setupStep='welcome';go('welcome');
}
function openSetupImages(){
 if(S.env!=='ready'){S.setupStep='components';go('environment');return;}
 S.setupStep='images';S.imageOrigin='setup';go('image-list');
}
function useSetupImage(id){
 if(S.setupStep!=='images'||S.env!=='ready'||!localImageIds().includes(id))return;
 S.setupStep='create';enterCreate(id);
}
function setupExitLabel(){return S.setupOrigin?.page==='settings'?'返回设置':'进入 Windroid';}
function leaveSetup(){
 if(!S.setupStep)return;
 if(S.imageJob)S.imageJob.guided=false;
 if(S.setupStep==='create'||S.setupStep==='images')delete S.createDraft;
 const origin=S.setupOrigin;
 delete S.setupOrigin;delete S.setupStep;S.imageOrigin='environment';
 if(origin?.page==='settings'){S.settingsTab=origin.tab;S.prefsOrigin=origin.prefsOrigin;go('settings');}
 else go('instances');
}
on('setup-enter',startWelcome);
on('setup-begin',()=>{
 if(S.setupStep!=='welcome')return;
 if(S.env==='ready')openSetupImages();else{S.setupStep='components';go('environment');}
});
on('setup-skip',leaveSetup);
on('setup-images',()=>{if(S.setupStep==='components')openSetupImages();});
on('setup-pick-image',id=>{
 if(S.setupStep!=='images'||S.env!=='ready'||!creationImages.some(i=>i.id===id))return;
 if(localImageIds().includes(id)){useSetupImage(id);return;}
 if(S.imageJob){
  if(S.imageJob.id===id){S.imageJob.guided=true;go('image-transfer');}
  else notify('请先完成或取消当前的镜像下载。');
  return;
 }
 S.overlay={kind:'image-terms',id,create:false};
});
pages.welcome=()=>{
 const fromSettings=S.setupOrigin?.page==='settings';
 return '<section class="setup-welcome"><div class="setup-intro"><img alt="" src="'+windroidMarkSrc+'"><h1>'+(fromSettings?'使用引导':'欢迎使用 Windroid')+'</h1><p>准备运行组件，选择系统镜像，创建 Android 实例。'+(fromSettings?'':'<br>也可以直接进入，随时再设置。')+'</p><div class="setup-buttons">'+b('开始设置','setup-begin','','primary')+b(fromSettings?'返回设置':'直接进入','setup-skip','','plain')+'</div></div></section>';
};
styles.push(`
.setup-welcome{display:grid;place-items:center;min-height:100%;padding:32px 22px;color:var(--ink);text-align:center}
.setup-intro img{display:block;width:56px;height:56px;margin:0 auto 20px}.setup-intro h1{font-size:26px;line-height:34px;font-weight:635;letter-spacing:-.035em}
.setup-intro p{margin:10px 0 24px;color:var(--muted);font-size:13px;line-height:21px}.setup-buttons{display:flex;justify-content:center;gap:9px}
.setup-images{height:100%;min-height:0;display:flex;flex-direction:column}.setup-images .setup-image-options{min-height:0;overflow:auto;flex:1}
.setup-images .ci-actions{margin:0;padding-top:8px}.setup-transfer-note{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px;font-size:12px;color:var(--muted)}
`);
poses['first-welcome']=()=>{runtimeResetFirst();startWelcome();};
poses['first-components']=()=>{runtimeResetFirst();S.setupStep='components';};
poses['first-images']=()=>{runtimeResetFirst();S.env='ready';openSetupImages();};
poses['first-create']=()=>{poses['first-images']();S.rtImages=['android-34'];useSetupImage('android-34');};
poses['first-direct']=()=>{runtimeResetFirst();go('instances');};
function resetPose(k){persistentWorkspace=false;if(!poses[k])k='library';S=seed();S.review=k;clearTimeout(toastTimer);poses[k]();if(innerWidth<650)S.collapsed=true;render();}
let labelBeforeDialog=null;
function refocus(el){if(!el)return;const q=Array.from(document.querySelectorAll('button[data-action]')).find(x=>x.dataset.action===el.action&&(x.dataset.value||'')===(el.value||'')&&x.offsetWidth);q?.focus({preventScroll:true});}
function render(){saveFirstUseWorkspace();const stage=document.getElementById('stage');let tip='';const renderer=pages[S.page]||pages.panel;const active=document.activeElement;const wasKey=document.body.classList.contains('using-keys');const ref=wasKey&&active?.dataset?.action?{action:active.dataset.action,value:active.dataset.value}:null;
 const previousSheet=stage.querySelector('.wx-active .wx-ask');
 const keepMenuFocus=active?.closest('.instance-menu');const oldScroll=stage.querySelector('.main')?.scrollTop||0;const oldListScroll=stage.querySelector('.list-scroll')?.scrollTop||0;const oldRailScroll=stage.querySelector('.navitems')?.scrollTop||0;const sceneKey=S.page+'|'+(S.page==='instances'?'all':S.selected);const oldScene=stage.dataset.scene;
 stage.className=[S.collapsed?'fold':'',(S.dark??matchMedia('(prefers-color-scheme: dark)').matches)?'dark':''].filter(Boolean).join(' ');stage.parentElement.classList.toggle('compact',!!S.compact);stage.parentElement.classList.toggle('first-use',!hasWorkspaceSidebar());stage.dataset.scene=sceneKey;
 if(S.toast)tip='<div class="toast" role="status">'+ico('info',15)+esc(S.toast)+'</div>';
 stage.innerHTML=bar()+'<div class="shell">'+sidebar()+'<main class="main">'+renderer()+'</main></div>'+windowSurface()+(S.overlay?(overlays[S.overlay.kind]?.()||''):'')+tip;
 if(sceneKey===oldScene){stage.querySelector('.main').scrollTop=oldScroll;const list=stage.querySelector('.list-scroll');if(list)list.scrollTop=oldListScroll;}const rail=stage.querySelector('.navitems');if(rail)rail.scrollTop=oldRailScroll;const check=stage.querySelector('[data-instance-all]');if(check)check.indeterminate=check.getAttribute('aria-checked')==='mixed';
 const closeSheet=stage.querySelector('.wx-active .wx-ask');
 if(closeSheet&&!S.overlay){
  const opening=closeSheet.dataset.owner!==previousSheet?.dataset.owner;
  if(opening)closeSheet.classList.add('entering');
  let target;
  if(!opening&&previousSheet.contains(active)){
   target=active.matches('input')?closeSheet.querySelector('input'):closeSheet.querySelector('[data-action="'+active.dataset.action+'"]');
  }
  (target||closeSheet.querySelector('[data-action="wx-choose-background"]')).focus({preventScroll:true});
 }else if(previousSheet&&!S.windowQuestion&&!S.overlay&&previousSheet.contains(active)){
  const [owner,app]=wxTarget(previousSheet.dataset.owner);
  const ownerWindow=stage.querySelector('[data-wx-window="'+CSS.escape(previousSheet.dataset.owner)+'"]');
  const tile=owner?.id===S.selected&&stage.querySelector('[data-app="'+CSS.escape(app)+'"] .launch');
  (ownerWindow?.querySelector('[data-action="wx-close"]')||stage.querySelector('.wx-active [data-action="wx-close"]')||tile||stage.querySelector('.panel-tabs [aria-selected="true"]'))?.focus({preventScroll:true});
 }else if(wasKey&&S.overlay?.kind==='panel-menu'){stage.querySelector('.instance-menu button')?.focus({preventScroll:true});}else if(wasKey&&keepMenuFocus&&!S.overlay&&S.page==='panel'&&!S.front){stage.querySelector('[data-action=panel-menu]')?.focus({preventScroll:true});}else if(wasKey){const dlg=stage.querySelector('[aria-modal="true"]');if(dlg){if(!labelBeforeDialog)labelBeforeDialog=ref;const btn=dlg.querySelector('button,select,input');btn?.focus({preventScroll:true})}else if(labelBeforeDialog){refocus(labelBeforeDialog);labelBeforeDialog=null}else refocus(ref);}
 if(S.focusNewApp){const key=S.focusNewApp;delete S.focusNewApp;stage.querySelector('.tile[data-app="'+CSS.escape(key)+'"] .launch')?.focus();}
 if(S.listSettingsOrigin&&oldScene!==sceneKey){
  if(S.page==='instances'){
   const origin=S.listSettingsOrigin,list=stage.querySelector('.list-scroll');
   delete S.listSettingsOrigin;
   if(list){list.scrollTop=origin.top;list.scrollLeft=origin.left;}
   refocus({action:'list-instance-settings',value:origin.id});
  }else if(S.page==='manage'&&wasKey)refocus({action:'runtime-return'});
 }
 const select=document.getElementById('scenes');if(select)select.value=S.review;
}
document.addEventListener('pointerdown',()=>document.body.classList.remove('using-keys'));
document.addEventListener('keydown',e=>{if(S.overlay?.kind==='panel-menu'&&['ArrowDown','ArrowUp','Home','End','Tab'].includes(e.key)){const items=Array.from(document.querySelectorAll('.instance-menu button'));if(items.length){e.preventDefault();const index=items.indexOf(document.activeElement);const next=e.key==='Home'?0:e.key==='End'?items.length-1:(index+(e.key==='ArrowUp'||(e.key==='Tab'&&e.shiftKey)?-1:1)+items.length)%items.length;items[next].focus();}return;}
 if(e.key==='ArrowDown'&&document.activeElement?.dataset.action==='panel-menu'&&!S.overlay){e.preventDefault();document.body.classList.add('using-keys');actions.get('panel-menu')();render();return;}
 if(e.key==='Tab'){document.body.classList.add('using-keys');const dlg=document.querySelector('#stage [aria-modal="true"]')||document.activeElement?.closest('.wx-ask');if(dlg){const all=Array.from(dlg.querySelectorAll('button:not(:disabled),input,select,summary,[tabindex="0"]')).filter(n=>n.offsetParent!==null);if(all.length&&(e.shiftKey&&document.activeElement===all[0]||!e.shiftKey&&document.activeElement===all.at(-1))){e.preventDefault();all[e.shiftKey?all.length-1:0].focus();}}}
 if(e.key==='Escape'&&S.overlay&&S.overlay.kind!=='apk-installing'){if(S.overlay.kind==='image-license'){S.overlay.kind='image-terms';}else{S.overlay=null;}render();}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const key=el.dataset.action;const fn=actions.get(key);if(!fn)return;fn(el.dataset.value||'');render();});
document.addEventListener('contextmenu',e=>{const tile=e.target.closest('[data-app]');if(tile){e.preventDefault();actions.get('ctx-app')(tile.dataset.app);render();}});
const stage=document.getElementById('stage');stage.addEventListener('dragover',e=>{if(!e.dataTransfer.types.includes('Files'))return;e.preventDefault();if(S.page==='panel'&&cur()?.state==='ready'&&!S.front&&!S.overlay)stage.classList.add('dragover');});
stage.addEventListener('dragleave',e=>{if(!stage.contains(e.relatedTarget))stage.classList.remove('dragover');});
stage.addEventListener('drop',e=>{e.preventDefault();stage.classList.remove('dragover');if(S.page==='panel'&&!S.front)dropApk(e.dataTransfer.files);});
const review=document.getElementById('scenes');
review.innerHTML=Object.entries(sceneGroups).map(([section,scenes])=>{
 const options=Object.entries(scenes).map(([key,label])=>'<option value="'+key+'">'+esc(label)+'</option>').join('');
 return '<optgroup label="'+esc(section)+'">'+options+'</optgroup>';
}).join('');
review.addEventListener('change',()=>{document.getElementById('guide').close();resetPose(review.value);});
document.getElementById('routes').onclick=()=>document.getElementById('guide').showModal();
document.getElementById('guide').addEventListener('click',e=>{const btn=e.target.closest('button[data-pose]');if(btn){const k=btn.dataset.pose;document.getElementById('guide').close();if(k)resetPose(k);}});
const modCSS=document.createElement('style');modCSS.textContent=styles.join('\n');document.head.append(modCSS);
const entryParams=new URLSearchParams(location.search);
if(entryParams.has('pose'))resetPose(entryParams.get('pose'));
else{
 const entryPreview=entryParams.get('entry');
 openFirstUseWorkspace(entryPreview==='guided'?true:entryPreview==='direct'?false:showGuideOnFirstLaunch);
}
</script></html>
