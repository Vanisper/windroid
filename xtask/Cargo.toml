[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "构建期工具：编译界面、生成能力声明与 TypeScript 类型。"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
nsh-bundler = "0.5"
nsh-base = "0.5"
# declarations：`nsh-core` 的编译期开关，决定类型声明文本是否被编进二进制。
# 不开这个 feature，`type_definitions` 会返回空模块（每个导出的 Ts 都是
# Internal），`.nsh/types` 里就没有 nsh/index.d.ts —— 编辑器里每个
# `from "nsh"` 都会报错，而构建本身完全正常。这是最容易漏掉的一环。
nsh-core = { version = "0.5", features = ["declarations"] }
nsh-js = "0.5"
